name: macOS synthetic CT smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/macos-smoke.yml
      - tests/**
      - skills/**
  pull_request:
    paths:
      - .github/workflows/macos-smoke.yml
      - tests/**
      - skills/**

permissions:
  contents: read

jobs:
  synthetic-ct:
    name: macOS 15 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify environment and install dependencies
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = "${{ matrix.arch }}"
          python --version
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          python -m pip install --no-cache-dir -r skills/myfilm-ct-review/scripts/requirements-web.txt
      - name: Test clean skill install, offline DICOM, and mock share flow in Chrome
        run: python -B tests/macos_smoke.py
